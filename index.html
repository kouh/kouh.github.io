<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalion - インディーゲーム開発サークル</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>Catalion</h1>
            <p class="tagline">ターン制のローグライクやRPGをつくるインディーゲーム開発サークル</p>
        </div>
        <nav>
            <a href="https://discord.gg/WNpqbqnejj" target="_blank">Discord</a>
        </nav>
    </header>

    <main>

        <section id="games">
            <h2>ゲーム一覧</h2>
            <div class="game-list">
                <div class="game-item">
                    <div class="status-tag developing">開発中</div>
                    <img src="images/seal_of_magic.png" alt="シールオブマジックのスクリーンショット">
                    <div class="game-text-content">
                        <h3>シールオブマジック</h3>
                        <p>シールでスコアを稼ぐローグライク</p>
                    </div>
                    <div class="store-links">
                        <a href="https://store.steampowered.com/app/3656060/" target="_blank">Steam</a>
                    </div>
                </div>
                <div class="game-item">
                    <div class="status-tag released">発売中</div>
                    <img src="images/dungeon_flowy.png" alt="Dungeon Flowyのスクリーンショット">
                    <div class="game-text-content">
                        <h3>Dungeon Flowy</h3>
                        <p>好きなジョブで6人パーティを組みダンジョンにもぐるオートバトルxハクスラRPG。</p>
                    </div>
                    <div class="store-links">
                        <a href="https://store.steampowered.com/app/3086520/" target="_blank">Steam</a>
                        <a href="https://www.dlsite.com/home/work/=/product_id/RJ01283905.html" target="_blank">DLsite</a>
                    </div>
                </div>
                <div class="game-item">
                    <div class="status-tag released">発売中</div>
                    <img src="images/bosstack.png" alt="Bosstackのスクリーンショット">
                    <div class="game-text-content">
                        <h3>Bosstack</h3>
                        <p>ジョブとスキルを組み合わせボスと戦うコマンドバトル</p>
                    </div>
                    <div class="store-links">
                        <a href="https://store.steampowered.com/app/2901820/" target="_blank">Steam</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Catalion</p>
    </footer>
</body>
</html>
